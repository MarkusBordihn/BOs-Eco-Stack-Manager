plugins {
  id 'net.neoforged.moddev' version '2.0.107'
}

base {
  archivesName = "${project.mod_id}-common-${project.minecraft_version}"
}

neoForge {
  neoFormVersion = neo_form_version
}

dependencies {}

processResources {
  def buildProps = project.properties.clone()

  filesMatching(['pack.mcmeta']) {
    expand buildProps
  }
}
